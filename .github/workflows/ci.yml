name: CI
# Push checks on dev satisfy the protected dev-to-main PR gate.
# No PR/comment/fork triggers: outside interactions must not start upstream CI.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: classroom-demo
          POSTGRES_DB: chat_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U chat -d chat_test"
          --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      PGHOST: localhost
      PGUSER: chat
      PGPASSWORD: classroom-demo
      PGDATABASE: chat_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python -m unittest discover -s tests -v
        working-directory: backend
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: docker compose config --quiet
      - run: docker compose build frontend backend codex
      - name: Test Codex adapter without account credentials
        run: docker compose run --rm -T --no-deps codex python - < codex-service/tests/test_adapter.py
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: bash scripts/security-check.sh history
      - run: python3 scripts/test_security_hooks.py
  ci-success:
    runs-on: ubuntu-latest
    if: always()
    needs: [frontend, backend, containers, security]
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          assert all(job['result'] == 'success' for job in results.values()), results
          PYCODE
